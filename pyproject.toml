[project]
name = "llm-fundamentos"
version = "0.1.0"
description = "Notebook de fundamentos de LLMs con Hugging Face e introducción a LangChain"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "evaluate>=0.4",
    "sentencepiece>=0.2",
    "sentence-transformers>=3.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
]

# En Linux y Windows se instala torch con soporte CUDA 12.8 (GPUs NVIDIA).
# En macOS se usa el torch por defecto de PyPI (CPU / Apple MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
